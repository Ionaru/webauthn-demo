services:
  server:
    image: ghcr.io/ionaru/webauthn-demo/server:${WD_BUILD_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    ports:
      - '3000:3000'
    environment:
      - WD_DB_URL
      - WD_DB_NAME
      - WD_SESSION_NAME
      - WD_SESSION_SECRET
    restart: unless-stopped
    healthcheck:
      test: 'wget --header="Accept: text/html" localhost:3000/graphql -q --spider'
      start_period: 30s

  client:
    image: ghcr.io/ionaru/webauthn-demo/client:${WD_BUILD_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/client.Dockerfile
    ports:
      - '${WD_CLIENT_PORT:-80}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:latest
    profiles: [local]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - db-volume:/data/db

volumes:
  db-volume:
